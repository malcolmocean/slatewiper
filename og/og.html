<!doctype html>
<!-- The 1200x630 link-preview card for creations.malcolmocean.com/slatewiper. Render with og/gen.sh. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Maven Pro"; font-weight: 400 900; src: url(/creations/site/maven-pro-latin.woff2) format("woff2"); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  background: radial-gradient(ellipse at 30% 40%, #1f3d33 0%, #142b23 55%, #0d1e18 100%);
  font-family: "Maven Pro", sans-serif; color: #eef3ee; position: relative;
}
body::before { /* chalk haze */
  content: ""; position: absolute; inset: 0; opacity: .5;
  background: repeating-linear-gradient(-8deg, rgba(255,255,255,.035) 0 2px, transparent 2px 9px),
              radial-gradient(ellipse at 20% 85%, rgba(255,255,255,.10), transparent 45%);
}
.text { position: absolute; left: 80px; top: 150px; width: 640px; }
h1 { font-size: 104px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 22px; line-height: 1; }
p { font-size: 34px; line-height: 1.3; margin: 0; color: #c8d9cf; }
img { position: absolute; right: 80px; top: 115px; width: 400px; height: 400px; border-radius: 88px; box-shadow: 0 0 0 2px rgba(255,255,255,.08), 0 24px 50px -10px rgba(0,0,0,.55); }
</style></head><body>
<div class="text"><h1>SlateWiper</h1><p>One button: archive every terminal session and browser tab somewhere findable, then close them all.</p></div>
<img src="/slatewiper/app/icon/SlateWiper-android-1254.png" alt="">
</body></html>
